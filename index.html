<title>말씀의 서고</title>
<style>
:root{--bg:#EDEAE1;--card:#FBF9F3;--ink:#211F1B;--mute:#6D685D;--line:#D8D2C5;--garnet:#8C2F39;--ok:#3F6B4E}
@media(prefers-color-scheme:dark){:root{--bg:#14161A;--card:#1B1E24;--ink:#E9E6DF;--mute:#98A1AE;--line:#2A2F38;--garnet:#CC7A7A;--ok:#7FBF9A}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);line-height:1.7;min-height:100vh;padding:0 20px 70px;
 font-family:'Apple SD Gothic Neo',-apple-system,system-ui,'Malgun Gothic',sans-serif}
.wrap{width:100%;max-width:720px;margin:0 auto}
header{text-align:center;padding:58px 0 26px}
.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--garnet);font-weight:800}
h1{font-family:AppleMyungjo,'Nanum Myeongjo',Georgia,serif;font-size:clamp(2rem,6vw,2.8rem);margin:14px 0 8px}
.sub{color:var(--mute);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px;margin-bottom:11px}
.card p.d{font-size:.88rem;color:var(--mute);margin-bottom:13px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:9px;
 background:var(--bg);color:var(--ink);font-size:1rem;font-family:inherit}
input:focus{outline:2px solid var(--garnet);outline-offset:1px}
button{padding:12px 20px;border:none;border-radius:9px;background:var(--garnet);color:#fff;
 font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.big{width:100%;padding:15px;font-size:1.02rem}
#msg{margin-top:11px;font-size:.86rem;min-height:1.2em;color:var(--garnet)}
#msg.ok{color:var(--ok)}
#out{display:none}
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 20px;margin-bottom:11px}
.grp h2{font-size:.76rem;letter-spacing:.14em;color:var(--garnet);font-weight:800;margin-bottom:9px}
.grp a{display:block;color:var(--ink);text-decoration:none;padding:9px 0;border-bottom:1px solid var(--line);font-size:.97rem}
.grp a:last-child{border-bottom:none} .grp a:hover{color:var(--garnet)}
footer{margin-top:24px;text-align:center;font-size:.75rem;color:var(--mute);line-height:1.8}
.hide{display:none}
</style></head><body><div class="wrap">
<header><div class="eyebrow">SEUNGMOK LEE</div><h1>말씀의 서고</h1>
<p class="sub">목록은 암호화되어 있습니다.</p></header>

<div id="gate">
  <div class="card hide" id="faceCard">
    <button class="big" id="faceBtn">🔓 Face ID · Touch ID 로 열기</button>
    <p class="d" style="margin:11px 0 0;text-align:center">이 기기에 등록되어 있습니다</p>
  </div>

  <div class="card">
    <p class="d">비밀번호로 여시면, 이 기기에 <b>Face ID를 등록</b>할 수 있습니다. 그 뒤로는 비밀번호가 필요 없습니다.</p>
    <form class="row" id="f">
      <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
      <button id="go" type="submit">열기</button>
    </form>
    <div id="msg"></div>
  </div>
</div>

<div id="out"></div>

<div class="card hide" id="regCard">
  <button class="big ghost" id="regBtn">＋ 이 기기에 Face ID 등록하기</button>
  <p class="d" style="margin:11px 0 0;text-align:center">다음부터 비밀번호 없이 열립니다</p>
</div>

<footer>검색에 노출되지 않습니다. 비밀번호 또는 등록된 기기로만 열립니다.<br>
등록 정보는 이 기기에만 저장되며 외부로 전송되지 않습니다.</footer>
</div>

const KEY = 'seogo_faceid_v1';
const dec = new TextDecoder(), enc = new TextEncoder();
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const $ = id => document.getElementById(id);
let MASTER = null;

function say(t, ok){ const m=$('msg'); m.textContent=t; m.className = ok?'ok':''; }

async function importK(raw){ return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']); }

async function unwrapWithPassword(pw){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const kek = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:fromB64(B.pw.salt), iterations:B.pw.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(B.pw.iv)}, kek, fromB64(B.pw.wrapped)));
}

async function revealWith(masterRaw){
  const k = await importK(masterRaw);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(B.iv)}, k, fromB64(B.ct));
  MASTER = masterRaw;
  const groups = JSON.parse(dec.decode(pt));
  $('gate').style.display='none';
  const out = $('out'); out.style.display='block';
  out.innerHTML = groups.map(g => `<div class="grp"><h2>${g.g}</h2>` +
    g.items.map(i => `<a href="${i.u}">${i.t}</a>`).join('') + `</div>`).join('');
  if (!localStorage.getItem(KEY) && window.PublicKeyCredential) $('regCard').classList.remove('hide');
}

/* ── 비밀번호 ── */
$('f').addEventListener('submit', async e => {
  e.preventDefault(); $('go').disabled = true; say('여는 중…');
  try { await revealWith(await unwrapWithPassword($('pw').value)); }
  catch { say('비밀번호가 맞지 않습니다.'); $('go').disabled=false; $('pw').select(); }
});

/* ── PRF 로 감싸는 키 얻기 ── */
async function prfSecret(credId){
  const opts = {
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    userVerification: 'required',
    extensions: { prf: { eval: { first: fromB64(B.prfSalt) } } }
  };
  if (credId) opts.allowCredentials = [{ id: fromB64(credId), type: 'public-key' }];
  const a = await navigator.credentials.get({ publicKey: opts });
  const r = a.getClientExtensionResults();
  if (!r.prf || !r.prf.results || !r.prf.results.first) throw new Error('PRF 미지원');
  return { secret: new Uint8Array(r.prf.results.first), id: toB64(a.rawId) };
}
async function kekFromPrf(secret){
  const base = await crypto.subtle.importKey('raw', secret, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'HKDF', hash:'SHA-256', salt:new Uint8Array(0), info:enc.encode('seogo-prf')},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}

/* ── 등록 ── */
$('regBtn').addEventListener('click', async () => {
  $('regBtn').disabled = true; $('regBtn').textContent = '등록 중…';
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: '말씀의 서고' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: '서고', displayName: '말씀의 서고' },
      pubKeyCredParams: [{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],
      authenticatorSelection: { residentKey:'required', userVerification:'required' },
      extensions: { prf: {} }
    }});
    const id = toB64(cred.rawId);
    const { secret } = await prfSecret(id);                 // 생성 직후 한 번 더 인증해 PRF 값을 얻는다
    const kek = await kekFromPrf(secret);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const wrapped = await crypto.subtle.encrypt({name:'AES-GCM', iv}, kek, MASTER);
    localStorage.setItem(KEY, JSON.stringify({ id, iv: toB64(iv), wrapped: toB64(wrapped) }));
    $('regCard').innerHTML = '<p class="d" style="text-align:center;margin:0;color:var(--ok)">✓ 이 기기에 등록되었습니다. 다음부터 Face ID로 열립니다.</p>';
  } catch (e) {
    $('regBtn').disabled = false;
    $('regBtn').textContent = '＋ 이 기기에 Face ID 등록하기';
    alert('등록하지 못했습니다. 이 브라우저가 패스키 키 유도(PRF)를 지원하지 않을 수 있습니다.\n\n' + (e && e.message ? e.message : ''));
  }
});

/* ── Face ID 로 열기 ── */
$('faceBtn').addEventListener('click', async () => {
  const st = JSON.parse(localStorage.getItem(KEY));
  $('faceBtn').disabled = true; $('faceBtn').textContent = '확인 중…';
  try {
    const { secret } = await prfSecret(st.id);
    const kek = await kekFromPrf(secret);
    const raw = new Uint8Array(await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:fromB64(st.iv)}, kek, fromB64(st.wrapped)));
    await revealWith(raw);
  } catch {
    $('faceBtn').disabled = false;
    $('faceBtn').textContent = '🔓 Face ID · Touch ID 로 열기';
    say('기기 인증에 실패했습니다. 비밀번호로 열어 주십시오.');
  }
});

if (localStorage.getItem(KEY)) $('faceCard').classList.remove('hide');
</script></body></html>
