<style>
:root{--bg:#EDEAE1;--card:#FBF9F3;--ink:#211F1B;--mute:#6D685D;--line:#D8D2C5;--garnet:#8C2F39;--ok:#3F6B4E}
@media(prefers-color-scheme:dark){:root{--bg:#14161A;--card:#1B1E24;--ink:#E9E6DF;--mute:#98A1AE;--line:#2A2F38;--garnet:#CC7A7A;--ok:#7FBF9A}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);line-height:1.7;min-height:100vh;
 padding:env(safe-area-inset-top) 20px 70px;
 font-family:'Apple SD Gothic Neo',-apple-system,system-ui,'Malgun Gothic',sans-serif}
.wrap{width:100%;max-width:720px;margin:0 auto}
header{text-align:center;padding:52px 0 22px}
.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--garnet);font-weight:800}
h1{font-family:AppleMyungjo,'Nanum Myeongjo',Georgia,serif;font-size:clamp(1.9rem,6vw,2.7rem);margin:12px 0 6px}
.sub{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:11px}
.card p.d{font-size:.87rem;color:var(--mute);margin-bottom:13px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:9px;
 background:var(--bg);color:var(--ink);font-size:1rem;font-family:inherit}
input:focus{outline:2px solid var(--garnet);outline-offset:1px}
button{padding:12px 20px;border:none;border-radius:9px;background:var(--garnet);color:#fff;
 font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.big{width:100%;padding:15px;font-size:1.02rem}
#msg{margin-top:11px;font-size:.85rem;min-height:1.2em;color:var(--garnet)}
#app{display:none}
/* 탭 */
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);
 border-radius:11px;padding:5px;margin-bottom:12px;position:sticky;top:8px;z-index:5}
.tabs button{flex:1;background:transparent;color:var(--mute);font-weight:700;padding:10px;border-radius:8px;font-size:.92rem}
.tabs button.on{background:var(--garnet);color:#fff}
.pane{display:none}.pane.on{display:block}
/* 결과물 */
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 20px;margin-bottom:11px}
.grp h2{font-size:.75rem;letter-spacing:.14em;color:var(--garnet);font-weight:800;margin-bottom:9px}
.grp a{display:block;color:var(--ink);text-decoration:none;padding:9px 0;border-bottom:1px solid var(--line);font-size:.96rem}
.grp a:last-child{border-bottom:none}.grp a:hover{color:var(--garnet)}
/* 현황 */
.tally{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tally div{flex:1;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.tally b{display:block;font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.tally span{font-size:.72rem;color:var(--mute)}
.sbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 20px}
.st{margin-bottom:11px}
.st .l{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:4px}
.st .l i{font-style:normal;color:var(--mute);font-size:.78rem;font-variant-numeric:tabular-nums}
.st .b{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.st .b s{display:block;height:100%;border-radius:4px}
footer{margin-top:22px;text-align:center;font-size:.74rem;color:var(--mute);line-height:1.8}
.hide{display:none}

</div>

<footer>검색에 노출되지 않습니다 · 등록 정보는 이 기기에만 저장됩니다</footer>

async function unwrapPw(pw){
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(B.pw.salt),iterations:B.pw.iter,hash:'SHA-256'},

  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(B.pw.iv)},kek,fromB64(B.pw.wrapped)));
}

function reveal(d){

async function prfSecret(id){
  const o={challenge:crypto.getRandomValues(new Uint8Array(32)),userVerification:'required',
    extensions:{prf:{eval:{first:fromB64(B.prfSalt)}}}};
  if(id) o.allowCredentials=[{id:fromB64(id),type:'public-key'}];
  const a=await navigator.credentials.get({publicKey:o});
  const r=a.getClientExtensionResults();
  if(!r.prf?.results?.first) throw new Error('PRF 미지원');
  return {secret:new Uint8Array(r.prf.results.first), id:toB64(a.rawId)};
}

  try{
    const c=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'말씀의 서고'},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'서고',displayName:'말씀의 서고'},
      pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],
      authenticatorSelection:{residentKey:'required',userVerification:'required'},
      extensions:{prf:{}}}});
    const id=toB64(c.rawId); const {secret}=await prfSecret(id);
    const kek=await kekPrf(secret); const iv=crypto.getRandomValues(new Uint8Array(12));
    localStorage.setItem(KEY,JSON.stringify({id,iv:toB64(iv),
      wrapped:toB64(await crypto.subtle.encrypt({name:'AES-GCM',iv},kek,MASTER))}));
    $('regCard').innerHTML='<p class="d" style="text-align:center;margin:0;color:var(--ok)">✓ 등록되었습니다. 다음부터 Face ID로 열립니다.</p>';
  }catch(e){$('regBtn').disabled=false;$('regBtn').textContent='＋ 이 기기에 Face ID 등록하기';
    alert('등록하지 못했습니다.\n'+(e?.message||''));}};

$('faceBtn').onclick=async()=>{const st=JSON.parse(localStorage.getItem(KEY));
  $('faceBtn').disabled=true;$('faceBtn').textContent='확인 중…';
  try{ const {secret}=await prfSecret(st.id); const kek=await kekPrf(secret);
    await openWith(new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(st.iv)},kek,fromB64(st.wrapped))));
  }catch{ $('faceBtn').disabled=false;$('faceBtn').textContent='🔓 Face ID · Touch ID 로 열기';
    say('기기 인증에 실패했습니다. 비밀번호로 열어 주십시오.'); }};

if(localStorage.getItem(KEY)) $('faceCard').classList.remove('hide');
</script></body></html>
