*{box-sizing:border-box;margin:0;padding:0}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--surf:#191c21;--surf2:#20242a;--ink:#edeff3;--ink2:#a6acb6;--ink3:#747b86;--line:#292e36;--th:#c4aaff}}

body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;letter-spacing:-.01em;
 font-family:'Apple SD Gothic Neo',-apple-system,system-ui,'Malgun Gothic',sans-serif;padding-top:env(safe-area-inset-top)}

 display:flex;gap:7px;padding:9px 14px;align-items:center;overflow-x:auto;white-space:nowrap}
.bar button{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--surf2);
 border:1.5px solid transparent;border-radius:8px;padding:7px 11px;cursor:pointer;flex-shrink:0}
.bar button.on{border-color:var(--th);color:var(--th)}
.bar .sp{flex:1;min-width:8px}

.eh .p{display:block;font-size:10.5px;color:var(--ink3);font-weight:600;margin-top:2px}
.eh .n{float:right;font-size:10.5px;color:var(--ink3);font-weight:600}
.rh{position:sticky;left:0;z-index:6;background:var(--bg);padding:10px 12px 10px 2px;font-size:12px;font-weight:700;
 border-right:1px solid var(--line);white-space:nowrap}
.rh .n{display:block;font-size:10.5px;color:var(--ink3);font-weight:600}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 6px;min-height:44px;vertical-align:top}

.ev{background:var(--surf);border:1px solid var(--line);border-left:3px solid;border-radius:7px;
 padding:6px 8px;margin-bottom:5px;cursor:pointer;box-shadow:0 1px 2px rgba(18,22,30,.05)}

 border-radius:99px;padding:0 5px;margin-top:3px;opacity:.85}

.note b{color:var(--ink2)}

,34,35,36,37,40],"e":[]},{"y":800,"t":"샤를마뉴 대관식","d":"교황 레오 3세가 샤를마뉴에게 황제관 수여. 서유럽 기독교 문명 형성의 기점. 교황권과 황권의 긴장 관계 시작.","p":[],"b":[37,38,41],"e":[]},{"y":1054,"t":"동서 교회 대분열","d":"로마 가톨릭과 동방정교회의 분리. 기독교 유신론 세계관이 두 갈래로 나뉘는 결정적 사건.","p":[37,53],"b":[4,20,38,39],"e":[]},{"y":1095,"t":"제1차 십자군","d":"교황 우르반 2세의 호소로 시작. 기독교 유신론이 전쟁의 종교적 동력이 된 상징적 사건.","p":[],"b":[4,20,38,39],"e":[]},{"y":1215,"t":"마그나 카르타","d":"영국 왕의 권력을 제한한 대헌장. 기독교적 법 이념(자연법)에 기반한 인권 개념의 맹아.","p":[38,42],"b":[38,39],"e":[]},{"y":1309,"t":"아비뇽 유수 (교황청 이전)","d":"1309-1377년 교황청이 프랑스 아비뇽으로 이전. 교황권의 프랑스 왕권 종속. 교황의 권위 실추. 교회 개혁의 필요성 절감.","p":[40],"b":[39,40,41],"e":[]},{"y":1378,"t":"서방 교회 대분열 (3명의 교황)","d":"1378-1417년 교황 2-3명이 동시 존재. 로마·아비뇽·피사 각각 교황 선출. 교황제도 신뢰 심각하게 손상. 종교개혁의 배경.","p":[],"b":[39,40,41],"e":[]},{"y":1492,"t":"콜럼버스 신대륙 발견","d":"지리적 세계관의 확장. 기독교 선교의 확대와 함께 식민지배의 시작. 유신론적 세계 정복의 명분.","p":[],"b":[2,40,41,43,44,46,55],"e":[]},{"y":1534,"t":"영국 국교회 성립","d":"헨리 8세의 이혼 문제로 로마 교황청과 결별. 종교와 국가 권력의 관계 재편.","p":[46],"b":[18,23,25,26,37,39,41,43,45,46,47,51],"e":[]},{"y":1572,"t":"성 바르톨로메오 학살","d":"프랑스에서 가톨릭이 위그노 3만여 명 학살. 종교적 확신이 폭력으로 귀결된 비극.","p":[47],"b":[18,23,25,26,37,39,41,43,45,46,47,51],"e":[]},{"y":1600,"t":"브루노 화형","d":"무한 우주론·지동설 지지로 화형. 과학적 진리와 교회 권위의 충돌을 상징하는 사건.","p":[],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]},{"y":1618,"t":"30년 전쟁","d":"유럽 최대의 종교전쟁. 1648년 베스트팔렌 조약으로 종결 후 교회의 정치적 권위 급격히 쇠퇴.","p":[],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]}],"theism|religion":[{"y":107,"t":"이그나티우스 순교","d":"안티오키아 주교 이그나티우스, 로마에서 맹수에 의해 순교. \"나는 하나님의 밀이다.\" 순교 신학의 원형.","p":[],"b":[5,17,18,25,30,33,34,35,36,40,62],"e":[]},{"y":155,"t":"폴리갑 순교","d":"스미르나 주교 폴리갑. \"86년 동안 그분을 섬겨왔는데, 어찌 그분을 욕되게 할 수 있겠소?\" 초대교회 신앙의 증거.","p":[],"b":[5,17,18,25,30,33,34,35,36,40,62],"e":[]},{"y":325,"t":"니케아 공의회","d":"삼위일체 교리 공식 확정. 성부·성자·성령의 관계를 논의하여 기독교 유신론 신학의 핵심 기초를 수립했다.","p":[35,36,40],"b":[27,32,34,35,36,37,40],"e":[]},{"y":381,"t":"콘스탄티노플 공의회 (삼위일체 확정)","d":"삼위일체 교리 최종 확정. 아리우스파 이단 정죄. 성령의 신성 공식 선언. 니케아 신경 완성.","p":[36],"b":[27,32,34,35,36,37,40],"e":[]},{"y":397,"t":"카르타고 공의회 (신약 정경 확정)","d":"27권 신약성경 정경 목록 공식 채택. 구약 39권과 함께 성경 66권 체계 확립. 무엇이 하나님의 말씀인가 결정.","p":[],"b":[27,32,34,35,36,37,40],"e":[]},{"y":590,"t":"교황 그레고리 1세 즉위","d":"\"종의 종\" 자처하며 중세 교황제도 기초 확립. 선교 열정과 교회 행정 정비. 앵글로색슨 선교 파송.","p":[],"b":[8,32,37],"e":[]},{"y":1415,"t":"얀 후스 화형 (콘스탄츠 공의회)","d":"보헤미아 종교개혁자 얀 후스, 이단 정죄 화형. 성경 권위와 교회 부패 비판. \"진리는 승리한다.\" 루터의 선구자.","p":[40],"b":[2,40,41,43,44,46,55],"e":[]},{"y":1517,"t":"루터의 95개 논제","d":"종교개혁의 시작. 교황 권위에 도전하고 성경 중심 신앙을 주장. 기독교 유신론의 내부 분화.","p":[45],"b":[18,23,25,26,37,39,41,43,45,46,47,51],"e":[{"장번호":"02-03","강도":"강","관계":"해당"},{"장번호":"05-02","강도":"강","관계":"해당"}]},{"y":1521,"t":"보름스 제국의회 (루터 입장 고수)","d":"\"여기 내가 서 있소, 달리 할 수 없소, 하나님이여 도우소서.\" 루터, 황제 앞에서 입장 취소 거부. 종교개혁의 돌이킬 수 없는 확립.","p":[],"b":[18,23,25,26,37,39,41,43,45,46,47,51],"e":[{"장번호":"02-03","강도":"강","관계":"해당"}]},{"y":1536,"t":"칼뱅 《기독교 강요》","d":"개혁 신학 체계화. 하나님의 절대 주권, 예정론, 말씀 중심 예배. 개혁교회의 신학적 기초.","p":[45],"b":[18,23,25,26,37,39,41,43,45,46,47,51],"e":[]},{"y":1545,"t":"트리엔트 공의회","d":"가톨릭 반종교개혁. 교리 재정비, 예수회 설립. 기독교 유신론 내의 가톨릭적 응답.","p":[],"b":[18,23,25,26,37,39,41,43,45,46,47,51],"e":[]}],"theism|korea":[{"y":635,"t":"경교, 당나라 도착·신라 전래 가능성","d":"네스토리우스파 선교사 알로펜, 당나라 도착. 638년 조정 공인. 당나라와 긴밀했던 신라를 통한 한반도 전래 가능성 추측. 불국사 돌십자가 등 증거.","p":[37],"b":[37,51],"e":[]},{"y":781,"t":"대진경교유행중국비 건립","d":"당나라 장안에 경교 전래 기념비 건립. 로마(대진)의 기독교(경교)가 중국에서 유행함을 기념. 1625년 발견. 한국교회사의 뿌리를 묻게 하는 사건.","p":[37],"b":[37],"e":[]},{"y":845,"t":"회창멸법: 경교 박해와 쇠퇴","d":"열렬한 도교 신자 무종의 외래종교 탄압령. 경교승 수백 명 환속. 4-7만 교도 개종·도주. 주로 지식인·관료 중심으로 민중 기반 없어 쇠퇴.","p":[37],"b":[37,38,41],"e":[]},{"y":1392,"t":"조선 건국, 성리학 채택","d":"유교적 천하관을 국가 이념으로 채택. 기독교와 다른 동아시아 유신론적 질서의 확립. 불교 억압.","p":[],"b":[39,40,41],"e":[]},{"y":1443,"t":"세종, 한글 창제","d":"민본주의적 소통 문자 창제. 유교적 왕도정치의 실천. 성리학적 세계관 아래 백성을 향한 교화 정신.","p":[],"b":[2,40,41,43,44,46,55],"e":[]},{"y":1592,"t":"임진왜란","d":"조선 성리학적 세계관의 첫 충격. 7년 전쟁 후 사회 질서 혼란. 조선 사회와 사상의 재편 계기.","p":[],"b":[18,23,25,26,37,39,41,43,45,46,47,51],"e":[]},{"y":1627,"t":"벨트브레(박연), 조선 최초 서양인 귀화","d":"네덜란드 개신교 신자 벨트브레, 경주 앞바다 표류 입국. 병자호란 참전. 조선 귀화 최초 서양인. 조선에 들어온 최초의 개신교 신자로 추정.","p":[],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]},{"y":1636,"t":"병자호란","d":"청나라에 패배, 인조의 삼전도 굴욕. 성리학적 명분론과 현실의 괴리. 조선의 세계관적 위기.","p":[],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]},{"y":1645,"t":"소현세자, 아담 샬과 만남","d":"병자호란 포로로 청에 억류된 소현세자가 예수회 독일 신부 아담 샬과 교류. 귀국 70일 만에 의문사. 가톨릭의 위로부터의 선교 전략 상징적 사건.","p":[],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]}],"theism|philosophy":[{"y":1274,"t":"아퀴나스 《신학대전》","d":"이성과 신앙의 조화. 아리스토텔레스 철학으로 기독교 신학을 체계화. 스콜라 철학의 완성.","p":[],"b":[38,39],"e":[]}],"theism|art":[{"y":1321,"t":"단테 《신곡》","d":"기독교 유신론적 우주관의 문학적 완성. 천국·연옥·지옥을 통해 신의 섭리와 인간 운명을 묘사.","p":[],"b":[39,40,41],"e":[]},{"y":1605,"t":"세르반테스 《돈키호테》","d":"중세 기사도(종교적 이상)의 붕괴와 현실의 충돌. 유신론 세계관 해체의 문학적 예고.","p":[],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]}],"theism|science":[{"y":1440,"t":"구텐베르크 인쇄술","d":"성경 대량 보급의 기술적 토대. 종교개혁을 가능하게 한 미디어 혁명. 지식 민주화의 시작.","p":[],"b":[2,40,41,43,44,46,55],"e":[]},{"y":1543,"t":"코페르니쿠스 지동설","d":"태양 중심 우주론. 지구 중심적 기독교 우주관에 균열. 과학혁명의 시작점.","p":[],"b":[18,23,25,26,37,39,41,43,45,46,47,51],"e":[]},{"y":1610,"t":"갈릴레오 망원경 관측","d":"목성의 위성 발견. 지동설의 관측 증거. 성경 해석과 과학 관측 사이의 긴장 표면화.","p":[],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]}],"deism|philosophy":[{"y":1620,"t":"베이컨 《신기관》","d":"귀납적 방법론 제시. 신학 대신 자연 탐구를 지식의 근거로. 근대 과학 방법론의 선언.","p":[47],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]},{"y":1637,"t":"데카르트 《방법서설》","d":"\"코기토 에르고 숨(나는 생각한다, 고로 존재한다).\" 이성 중심 철학, 신학으로부터 독립 선언.","p":[],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]},{"y":1651,"t":"홉스 《리바이어던》","d":"사회계약론. 국가 정당성을 신이 아닌 인간 합의에서 찾음. 세속 정치철학의 기초.","p":[],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]},{"y":1670,"t":"스피노자 《신학정치론》","d":"성경의 이성적 비평. \"신=자연\"(Deus sive Natura). 범신론적 이신론으로 기독교 계시를 해체.","p":[],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]},{"y":1690,"t":"로크 《인간오성론》","d":"경험론. 지식의 근거를 신의 계시가 아닌 감각 경험에서 찾음. 계몽주의 인식론의 기초.","p":[],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]},{"y":1739,"t":"흄 《인간 본성론》","d":"인과율 회의. 기적·설계 논증 해체 시도. 이신론마저 비판하며 자연주의의 선구자가 됨.","p":[],"b":[17,22,23,29,36,41,48,50,51,65,66,68,69,75],"e":[]},{"y":1748,"t":"몽테스키외 《법의 정신》","d":"삼권분립 이론. 법의 근거를 신이 아닌 자연과 이성에서 찾음. 근대 민주주의 이론의 토대.","p":[],"b":[17,22,23,29,36,41,48,50,51,65,66,68,69,75],"e":[]},{"y":1751,"t":"《백과전서》 편찬 시작","d":"디드로·달랑베르 편집. 지식 체계의 세속화. 종교적 권위를 이성의 권위로 대체하는 상징.","p":[],"b":[17,22,23,29,36,41,48,50,51,65,66,68,69,75],"e":[]},{"y":1762,"t":"루소 《사회계약론》","d":"\"일반의지\"와 세속 도덕 모색. 자연종교 제안. 계몽주의적 정치·종교 이상의 결정판.","p":[],"b":[17,22,23,29,36,41,48,50,51,65,66,68,69,75],"e":[]},{"y":1770,"t":"돌바크 《자연의 체계》","d":"체계적 무신론·유물론. 신·영혼·자유의지 전면 부정. 자연주의로 가는 결정적 한 걸음.","p":[],"b":[17,22,23,29,36,41,48,50,51,65,66,68,69,75],"e":[]},{"y":1781,"t":"칸트 《순수이성비판》","d":"이성으로 신을 증명하는 것은 불가능. 신학과 과학의 영역을 분리. 근대 철학의 전환점.","p":[],"b":[17,22,23,29,36,41,48,50,51,65,66,68,69,75],"e":[]}],"deism|history":[{"y":1648,"t":"베스트팔렌 조약","d":"30년 전쟁 종결. 국가 주권 확립, 종교의 정치적 절대 권위 약화. 세속 근대 국가 질서 시작.","p":[66],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]},{"y":1689,"t":"영국 명예혁명·관용법","d":"의회 주권 확립, 종교적 관용 법제화. 신앙을 이성과 관용의 틀 안에서 재편.","p":[48],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]},{"y":1755,"t":"리스본 대지진","d":"3만~6만 명 사망. \"선한 하나님이 이런 일을 허용하는가?\" 섭리론·신정론에 대한 유럽의 회의 심화.","p":[],"b":[17,22,23,29,36,41,48,50,51,65,66,68,69,75],"e":[]},{"y":1776,"t":"미국 독립선언","d":"\"모든 사람은 평등하게 창조되었다.\" 계몽주의 이신론적 정치 이상의 현실화.","p":[48],"b":[17,22,23,29,36,41,48,50,51,65,66,68,69,75],"e":[]},{"y":1789,"t":"프랑스 대혁명","d":"교회 재산 몰수, 성직자 추방. 이성의 여신 숭배. 기독교 유신론 세계관의 정치적 해체.","p":[48],"b":[17,22,23,29,36,41,48,50,51,65,66,68,69,75],"e":[]}],"deism|korea":[{"y":1653,"t":"하멜, 제주도 표착","d":"네덜란드 동인도회사 선원 하멜 일행 36명, 제주도에 표착. 13년 억류 후 탈출하여 《하멜 표류기》 저술. 조선 최초의 서양 체류 기록. 당시 조선의 쇄국 분위기를 서방에 알린 사건.","p":[],"b":[10,20,37,39,42,47,48,51,55,66],"e":[]},{"y":1784,"t":"이승훈, 천주교 세례 (북경)","d":"한국 최초의 자발적 천주교 수용. 서학(西學)의 유입. 조선 성리학 세계관과의 본격 충돌 시작.","p":[],"b":[17,22,23,29,36,41,48,50,51,65,66,68,69,75],"e":[]},{"y":1785,"t":"을사추조적발사건","d":"한양 function build(){

      const evs=D.cells[w.k+'|'+c.k]||[];
      let band=false, inner='';
      evs.forEach(e=>{
        const nL=e.p.length+e.e.length, sL=thm!=='off'&&nL>0, sB=thm==='band'&&e.b.length>0;
        if(sB) band=true;
        let lst='';
        if(sL){
          e.p.forEach(n=>{const k=String(n);lst+=`<div><span class="k">보관함 ${k.padStart(3,'0')}</span>${esc(D.t[k]||'제목 미확인')}</div>`;});
          e.e.forEach(o=>{const ch=D.ch[o['장번호']]||{};const ab=o['관계']==='불참';
            lst+=`<div style="${ab?'opacity:.7':''}"><span class="k">영토들 ${o['장번호']}</span>${esc(ch.n||'')}${ab?' <i style="font-size:9.5px;border:1px dashed var(--ink3);border-radius:3px;padding:0 3px">불참</i>':''}</div>`;});
        }
        inner+=`<div class="ev" style="border-left-color:${c.c}"><div class="y" style="color:${c.c}">${e.y}</div>`+
               `<div class="t">${esc(e.t)}</div>`+
               (sL?`<span class="th">신학 ${nL}</span>`:(sB?`<span class="th" style="border-style:dashed;opacity:.6">띠 ${e.b.length}</span>`:''))+
               `<div class="d">${esc(e.d)}</div>`+(lst?`<div class="lst">${lst}</div>`:'')+`</div>`;
